services:
  - type: web
    name: ekub-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push && npx tsx prisma/seed.ts && node dist/main
    healthCheckPath: /api
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: ekub-db
          property: connectionString

databases:
  - name: ekub-db
    databaseName: ekub
    plan: free
